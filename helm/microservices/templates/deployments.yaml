{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ $.Values.dockerUser }}/{{ .image }}:{{ $.Values.tag }}
          imagePullPolicy: Always
          command: ["sh", "-c", "uvicorn main:app --host 0.0.0.0 --port 8000"]
          ports:
            - containerPort: 8000
{{- if eq .name "gateway" }}
          env:
            - name: USERS_SERVICE_URL
              value: http://users:8000
            - name: ORDERS_SERVICE_URL
              value: http://orders:8000
{{- end }}
---
{{- end }}
